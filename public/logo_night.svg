<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Flow Network — Double Cut</title>
  <desc id="desc">A minimal turquoise circular mark divided by two flowing paths.</desc>
  <defs>
    <linearGradient id="brand" x1="54" y1="43" x2="207" y2="214" gradientUnits="userSpaceOnUse">
      <stop stop-color="#12C5CA"/>
      <stop offset="1" stop-color="#049EAE"/>
    </linearGradient>
    <mask id="flowCuts" maskUnits="userSpaceOnUse" x="24" y="24" width="208" height="208">
      <rect x="24" y="24" width="208" height="208" fill="#fff"/>

      <!-- Original vertical flow cut -->
      <path d="M151 19C128 36 124 56 124 84v55c0 29-10 46-31 59-15 9-23 20-26 39" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>

      <!-- One additional randomized diagonal cut -->
      <path d="M25 174c38-12 65-28 89-49 31-27 62-39 117-40" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>
    </mask>
  </defs>

  <circle cx="128" cy="128" r="96" fill="url(#brand)" mask="url(#flowCuts)"/>
</svg>
